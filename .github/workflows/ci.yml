name: CI

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  ci:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src __tests__

      - name: Test with coverage
        # jest --coverage fails non-zero when coverage thresholds defined in
        # jest.config.js (lines 80 / branches 75 / functions 80 / statements 80)
        # are not met. The labels-parity test (__tests__/labels/labels.test.ts)
        # runs as part of the normal jest suite; no separate step is needed.
        run: npx jest --coverage
